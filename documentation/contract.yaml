# Machine-readable claims this repository's documentation makes about defaults, entry points,
# config shapes and their effects — checked against a PUBLISHED (never local) NuGet install, never
# a workspace build. See documentation/contract-gate.md for what runs this and when.
#
# Schema (four `kind`s, docs-vs-published-gate §2):
#   id                  unique slug
#   kind                entry-point | reflectable-default | probed-default | config-shape
#   page                "<doc path>#<anchor>" — the sentence this entry backs
#   claim               one human sentence
#   documented_default  (reflectable-default, probed-default) the exact observed value expected
#   expected_effect     (config-shape) same role, named the way the design note spells it
#   probe               source file (repo-relative) implementing the check
#   coordinate          (entry-point only) NuGet package id
#   registry            (entry-point only) nuget-org (default)
#
# Every entry describes the code it is committed with (owner ruling 2026-09-24): there is no
# version field. ContractLint (per commit, no network) validates this file's shape; ContractCheck
# (nightly, registry-backed) reads the contract AT THE TAG it installs and runs contract-probe/
# against that same artifact, so claim and package always come from one commit.
version_source: "Directory.Build.props#VersionPrefix"
entries:
  # ---- entry points: does the package resolve at all, on the real registry -------------------
  - id: entry-point-core
    kind: entry-point
    registry: nuget-org
    coordinate: "NarrativeTrace.Core"
    page: "documentation/guides/installation.md#packages"
    claim: "NarrativeTrace.Core resolves on nuget.org at the installed version"
    documented_default: "PRESENT"
    probe: "contract-probe/Probes/EntryPointProbe.cs"

  - id: entry-point-runtime
    kind: entry-point
    registry: nuget-org
    coordinate: "NarrativeTrace.Runtime"
    page: "documentation/guides/installation.md#packages"
    claim: "NarrativeTrace.Runtime resolves on nuget.org at the installed version"
    documented_default: "PRESENT"
    probe: "contract-probe/Probes/EntryPointProbe.cs"

  - id: entry-point-proxy
    kind: entry-point
    registry: nuget-org
    coordinate: "NarrativeTrace.Proxy"
    page: "documentation/guides/installation.md#packages"
    claim: "NarrativeTrace.Proxy resolves on nuget.org at the installed version"
    documented_default: "PRESENT"
    probe: "contract-probe/Probes/EntryPointProbe.cs"

  - id: entry-point-logging
    kind: entry-point
    registry: nuget-org
    coordinate: "NarrativeTrace.Logging"
    page: "documentation/guides/installation.md#packages"
    claim: "NarrativeTrace.Logging resolves on nuget.org at the installed version"
    documented_default: "PRESENT"
    probe: "contract-probe/Probes/EntryPointProbe.cs"

  # doctor verb: a full behavioral probe would need a contract-probe capable of exercising a
  # packed dotnet tool, not just a restored library — out of scope here (the commit that added the
  # verb noted this at the time). This is the honest, expressible slice of the same claim: the
  # package the verb ships in actually resolves at the release version.
  - id: entry-point-cli
    kind: entry-point
    registry: nuget-org
    coordinate: "NarrativeTrace.Cli"
    page: "documentation/guides/installation.md#validate-installation"
    claim: "NarrativeTrace.Cli (carrying the doctor verb) resolves on nuget.org at the installed version"
    documented_default: "PRESENT"
    probe: "contract-probe/Probes/EntryPointProbe.cs"

  # ---- reflectable defaults: read straight off the published public API, nothing executed -----
  - id: reflectable-output-default
    kind: reflectable-default
    page: "documentation/guides/installation.md#configure-trace-output"
    claim: "NARRATIVETRACE_OUTPUT defaults to true — ConfigResolver.Resolve().Output is true with no variable set"
    documented_default: "true"
    probe: "contract-probe/Probes/OutputDefaultProbe.cs"

  - id: reflectable-approval-default
    kind: reflectable-default
    page: "documentation/guides/configuration.md#2-environment-variables-configresolver"
    claim: "NARRATIVETRACE_APPROVAL defaults to false — ConfigResolver.Resolve().Approval is false with no variable set"
    documented_default: "false"
    probe: "contract-probe/Probes/ApprovalDefaultProbe.cs"

  # ---- probed defaults: run a small traced call against the published package, read the trace -
  - id: probed-proxy-options-redaction
    kind: probed-default
    page: "documentation/privacy-and-redaction.md#redaction-surface-by-surface"
    claim: "NarrativeTraceProxy.Create<T> with new ProxyOptions(Redaction: ...) replaces the default redaction decision for that proxy"
    documented_default: "true"
    probe: "contract-probe/Probes/ProxyOptionsRedactionProbe.cs"

  - id: probed-not-traced-rejected-on-method
    kind: probed-default
    page: "documentation/guides/annotations.md#nottraced"
    claim: "[NotTraced] on a method throws InvalidOperationException at proxy-creation time, naming the attribute and the offending method"
    documented_default: "true"
    probe: "contract-probe/Probes/NotTracedOnMethodRejectedProbe.cs"

  - id: probed-templates-honour-redaction
    kind: probed-default
    page: "documentation/guides/annotations.md#nottraced"
    claim: "a [Narrated] template resolved on a proxy built with a custom ProxyOptions.Redaction renders a redacted placeholder for a path that policy denies"
    documented_default: "true"
    probe: "contract-probe/Probes/TemplatesHonourRedactionProbe.cs"

  - id: probed-typed-error-marker
    kind: probed-default
    page: "documentation/privacy-and-redaction.md#guarantees"
    claim: "a throwing [NarrativeSummary] member degrades to a typed <error: TypeName> placeholder — the exception's message is excluded"
    documented_default: "<error: InvalidOperationException>"
    probe: "contract-probe/Probes/TypedErrorMarkerProbe.cs"

  - id: probed-native-stringification-not-trusted
    kind: probed-default
    page: "documentation/privacy-and-redaction.md#guarantees"
    claim: "a class exposing public state is rendered by reflecting over its members — a hand-written ToString() that interpolates a denied field is never reached"
    documented_default: "field-walked-not-tostring"
    probe: "contract-probe/Probes/NativeStringificationNotTrustedProbe.cs"

  - id: probed-platform-type-carveout
    kind: probed-default
    page: "documentation/privacy-and-redaction.md#guarantees"
    claim: "a platform scalar type (decimal) renders via its own value representation rather than being field-walked"
    documented_default: "own-representation-used"
    probe: "contract-probe/Probes/PlatformTypeCarveoutProbe.cs"

  - id: reflectable-per-invocation-identity
    kind: reflectable-default
    page: "documentation/structural-trace-format.md#artifact-identity-cross-platform"
    claim: "two invocations of the same scenario differ by a 1-based invocation index suffix, never by a display-name label alone"
    documented_default: "index-suffixed"
    probe: "contract-probe/Probes/ReflectablePerInvocationIdentityProbe.cs"

  # ---- config shapes: a documented shape run against the published package, one named effect --
  - id: config-shape-one-package-install
    kind: config-shape
    page: "documentation/sixty-seconds.md#1-new-console-app-add-the-package"
    claim: "NarrativeTrace.Proxy's published .nuspec depends on NarrativeTrace.Runtime, which depends on NarrativeTrace.Core — one dotnet add package resolves the whole chain"
    expected_effect: "true"
    probe: "contract-probe/Probes/OnePackageInstallProbe.cs"

  - id: config-shape-tracelogexporter-export-to-logger
    kind: config-shape
    page: "documentation/sixty-seconds.md#send-it-to-your-logger"
    claim: "TraceLogExporter.ExportToLogger replays a captured tree onto an ILogger, one Information-level record per node"
    expected_effect: "true"
    probe: "contract-probe/Probes/TraceLogExporterProbe.cs"

  - id: probed-run-name-console-footer
    kind: probed-default
    page: "documentation/guides/configuration.md#7-logging-bridge-microsoftextensionslogging"
    claim: "the console suite footer names the run: a \"run: <phrase>\" line"
    documented_default: "true"
    probe: "contract-probe/Probes/RunNameConsoleFooterProbe.cs"

  - id: probed-run-name-manifest-field
    kind: probed-default
    page: "documentation/guides/configuration.md#7-logging-bridge-microsoftextensionslogging"
    claim: "manifest.json carries a top-level run object (id, name) naming the run it belongs to"
    documented_default: "true"
    probe: "contract-probe/Probes/RunNameManifestFieldProbe.cs"

  # The commit that added traceparent adoption deliberately shipped without these: a properly
  # verified probe against the published package belongs with release prep rather than that change.
  - id: probed-initial-traceparent-seeds-context
    kind: probed-default
    page: "documentation/guides/configuration.md#traceparent-seeding"
    claim: "new NarrativeTraceConfig(initialTraceparent: Traceparent.Parse(...)) seeds a context's CurrentTraceId with the parsed trace id"
    documented_default: "true"
    probe: "contract-probe/Probes/InitialTraceparentSeedsContextProbe.cs"

  - id: probed-middleware-adopts-traceparent
    kind: probed-default
    page: "documentation/guides/configuration.md#4-aspnet-core"
    claim: "NarrativeTraceMiddleware adopts an inbound traceparent request header automatically, continuing the caller's trace"
    documented_default: "true"
    probe: "contract-probe/Probes/MiddlewareAdoptsTraceparentProbe.cs"

  - id: probed-logger-level-does-not-affect-capture
    kind: probed-default
    page: "documentation/guides/configuration.md#8-two-dials-two-paths"
    claim: "a logger's own minimum level (even set so every level is disabled) never affects what CaptureTrace() returns — only TracingLevel does"
    documented_default: "true"
    probe: "contract-probe/Probes/LoggerLevelDoesNotAffectCaptureProbe.cs"
