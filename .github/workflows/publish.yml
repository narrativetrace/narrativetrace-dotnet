name: Publish

# Public release — authored in the private tree like ci.yml and shipped with
# the snapshot. Fires on the annotated v<version> tag scripts/publish-public.sh
# pushes; the `release` environment (required reviewer, v* tags only — set up
# one-time by the private secrets-provisioning script) gates the job, so
# publishing happens only after a human approves this exact run.
#
# Publishing uses NuGet Trusted Publishing (OIDC): NuGet/login exchanges this
# workflow's identity token for a short-lived API key, so no long-lived
# NUGET_API_KEY secret exists to leak or rotate. The nuget.org policy pins
# this exact file path — .github/workflows/publish.yml — plus the repository
# and the `release` environment; renaming this file breaks publishing on
# purpose. NUGET_USER is a repository variable carrying the nuget.org profile
# name (set by the private secrets-provisioning script).

on:
  push:
    tags: ["v*"]
  # A manual run still passes the `release` environment, whose deployment
  # policy admits v* tags only — a dispatch from a branch is refused at the
  # gate, and the tag assertion below refuses it again.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      # Trusted Publishing: NuGet/login presents this job's OIDC token to
      # nuget.org in exchange for a temporary API key.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.301'

      # Same check publish-public.sh already applies before it will create a
      # tag (detect_version + the *-SNAPSHOT*|*-dev*|0.0.0 refusal) — repeated
      # here because the tag is what actually triggers this job, and the
      # workflow must not trust that the tag it was handed is one the script
      # produced.
      - name: Assert tag matches the library version
        run: |
          version="$(grep -o '<VersionPrefix>[^<]*' Directory.Build.props | head -1 | cut -d'>' -f2)"
          [ "v$version" = "${GITHUB_REF_NAME}" ] || {
            echo "tag ${GITHUB_REF_NAME} does not match build version $version"; exit 1; }
          case "$version" in
              *-SNAPSHOT*|*-dev*|0.0.0)
                  echo "refusing to release $version"; exit 1 ;;
          esac

      # SecretsScan (gitleaks) rides Verify's offline DependsOn chain — see
      # ci.yml's identical step.
      - name: Install gitleaks
        run: sudo scripts/install-security-tools.sh gitleaks

      # The single quality gate — same invocation as ci.yml. A tag push does
      # not imply the tagged commit ever ran it (the public branch is pushed
      # by hand after review), so it runs again here rather than being
      # trusted.
      - name: Verify
        # --skip Benchmark for the same reason the publish script's container
        # verify skips it: the regression gate compares against baselines
        # recorded on the bare dev host, and a shared 2-core runner can never
        # meet host-native nanosecond numbers (proven on the first public CI
        # run: every target green, then "Benchmark regressions: 42").
        # Measurement gates run on matched hardware, host/nightly cadence.
        run: ./build.sh Verify --skip Benchmark

      - name: Pack
        run: ./build.sh Pack

      # The temporary key this mints is valid for about an hour and only
      # under this repository's pinned policy.
      - name: NuGet login (Trusted Publishing)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate makes a re-run after a partial failure safe:
      # already-published packages are not re-rejected as errors.
      - name: Push to NuGet
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
